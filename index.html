<style>
/* Layout: hisob daftari — chap tomonda bo'limlar, o'ngda zich jadvallar; raqamlar monoshirift, ustunlar bo'yicha tekislangan */
:root {
  --bg: #eef2f0; --surface: #ffffff; --surface-2: #f6f8f7; --fg: #16201e; --muted: #5b6a66; --line: #d9e1de; --line-2: #c5d0cc;

  --ok: #1d7a4c; --warn: #9a6200; --warn-soft: #fbf0d9; --danger: #b3261e; --danger-soft: #fbe4e1;
  --t-in: #1d7a4c; --t-out: #1f4e8c; --t-move: #6b4fa0; --t-loss: #9a3412;
  --font: "PT Sans", "Segoe UI", system-ui, sans-serif; --display: "PT Sans Narrow", "PT Sans", "Arial Narrow", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px; --shadow: 0 1px 2px rgba(20,40,35,.06), 0 6px 24px rgba(20,40,35,.08);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1513; --surface: #151e1c; --surface-2: #1a2522; --fg: #e3ebe8; --muted: #93a39f; --line: #26332f; --line-2: #33433f;
  --accent: #5bb3a6; --accent-fg: #06201c; --accent-soft: #19342f; --stamp: #e39a6b;
  --ok: #4cc28a; --warn: #e2aa45; --warn-soft: #2e2512; --danger: #ef7a70; --danger-soft: #3a1b18;
  --t-in: #4cc28a; --t-out: #7aa9ea; --t-move: #b49be0; --t-loss: #ec9a6c; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #151e1c; --surface-2: #1a2522; --fg: #e3ebe8; --muted: #93a39f; --line: #26332f; --line-2: #33433f;
  --accent: #5bb3a6; --accent-fg: #06201c; --accent-soft: #19342f; --stamp: #e39a6b;
  --ok: #4cc28a; --warn: #e2aa45; --warn-soft: #2e2512; --danger: #ef7a70; --danger-soft: #3a1b18;
  --t-in: #4cc28a; --t-out: #7aa9ea; --t-move: #b49be0; --t-loss: #ec9a6c; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35); color-scheme: dark }

* { box-sizing: border-box; }
html, body, #app { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.75rem; line-height: 1.15; }
h2 { font-size: 1.15rem; margin-bottom: .6rem; }
h3 { font-size: 1.2rem; }
.mono { font-family: var(--mono); font-size: .92em; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: .85rem; } .strong { font-weight: 700; }
.grow { flex: 1; }
.row-gap { display: flex; gap: .5rem; align-items: center; } .wrap { flex-wrap: wrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* inputs */
input, select, textarea { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: .45rem .6rem; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input[readonly], input:disabled, select:disabled { background: var(--surface-2); color: var(--muted); }
input.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.fld { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
.fld label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.req { color: var(--danger); margin-left: 2px; }
.hint { color: var(--muted); font-size: .8rem; } .hint.ok { color: var(--ok); }
.check { display: flex; gap: .5rem; align-items: center; cursor: pointer; }
.check input { width: auto; }
.inline { display: flex; align-items: center; gap: .4rem; } .inline span { font-size: .85rem; color: var(--muted); white-space: nowrap; } .inline input, .inline select { width: auto; }
.err { color: var(--danger); background: var(--danger-soft); padding: .5rem .7rem; border-radius: var(--r); margin: .5rem 0; }
.note { color: var(--muted); font-size: .88rem; margin: .5rem 0; }
.note.lock { color: var(--warn); background: var(--warn-soft); padding: .5rem .7rem; border-radius: var(--r); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: .35rem; padding: .5rem .9rem; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; white-space: nowrap; font-weight: 700; font-size: .92rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: var(--danger); } .btn.danger:not(.ghost) { background: var(--danger); color: #fff; }
.btn.sm { padding: .3rem .6rem; font-size: .85rem; }
.btn.block { width: 100%; justify-content: center; padding: .65rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.file { position: relative; overflow: hidden; } .btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.icon-btn { border: 0; background: transparent; cursor: pointer; padding: .3rem .45rem; border-radius: var(--r); color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
.link.back { font-size: .9rem; margin-bottom: .3rem; }
.chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: .25rem .7rem; cursor: pointer; font-size: .85rem; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.pill { display: inline-block; padding: .1rem .55rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: .8rem; font-weight: 700; width: fit-content; }
.pill.lockp { background: var(--warn-soft); color: var(--warn); margin-top: .6rem; }

/* doc type tags */
.tag { display: inline-block; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: .1rem .45rem; border-radius: 3px; border: 1px solid currentColor; }
.tag.big { font-size: .9rem; vertical-align: middle; }
.tag.receipt, .tag.return_in { color: var(--t-in); } .tag.sale, .tag.return_out { color: var(--t-out); }
.tag.transfer { color: var(--t-move); } .tag.writeoff, .tag.inventory { color: var(--t-loss); }

/* shell */
.boot { display: grid; place-items: center; height: 100%; color: var(--muted); }
.shell { min-height: 100%; display: grid; grid-template-columns: 228px minmax(0, 1fr); grid-template-rows: auto 1fr; }
.shell:not(:has(.side)) { grid-template-columns: minmax(0, 1fr); }
.shell > * { min-width: 0; }
.topbar { grid-column: 1 / -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: .75rem; padding: .55rem 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: .5rem; font-family: var(--display); font-size: 1.1rem; white-space: nowrap; }
.brand .mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 5px; background: var(--accent); color: var(--accent-fg); font-family: var(--mono); font-weight: 500; }
.brand.big { font-size: 1.6rem; } .brand.big .mark { width: 38px; height: 38px; font-size: 1.2rem; }
.firm-switch { display: flex; align-items: center; gap: .55rem; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: .3rem .65rem; cursor: pointer; min-width: 0; }
.firm-switch:hover { border-color: var(--accent); }
.fs-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 28ch; }
.mode-pill { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; padding: .15rem .5rem; border-radius: 3px; border: 1px dashed var(--stamp); color: var(--stamp); }
.lang { width: auto; padding: .3rem .4rem; }
.user-btn { display: flex; align-items: center; gap: .4rem; border: 0; background: none; cursor: pointer; }
.avatar { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; text-transform: uppercase; }
.burger { display: none; font-size: 1.2rem; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: .8rem .6rem; position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; display: flex; flex-direction: column; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav button { display: flex; align-items: center; gap: .6rem; border: 0; background: none; text-align: left; padding: .5rem .65rem; border-radius: var(--r); cursor: pointer; color: var(--fg); }
.side nav button:hover { background: var(--surface-2); }
.side nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.ni { width: 1.2rem; text-align: center; font-family: var(--mono); color: var(--muted); }
.side nav button.on .ni { color: var(--accent); }
.side-foot { margin-top: auto; font-size: .82rem; color: var(--warn); padding: .5rem; }
.main { min-width: 0; padding: 1.4rem 24px 4rem; }
.scrim { display: none; }

/* page */
.page { display: flex; flex-direction: column; gap: 1rem; max-width: 1400px; margin: 0 auto; }
.page.narrow { max-width: 900px; }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
.page-h p { margin: .3rem 0 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.1rem; min-width: 0; }
.panel-h { display: flex; align-items: center; gap: .6rem; margin-bottom: .6rem; flex-wrap: wrap; } .panel-h h2 { margin: 0; }
.panel-h select { width: auto; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.filters { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center; }
.tabs { display: flex; gap: .2rem; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: .55rem .9rem; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; color: var(--muted); font-weight: 700; }
.tabs button.on { border-color: var(--accent); color: var(--fg); }
.count { display: inline-grid; place-items: center; min-width: 1.4rem; height: 1.4rem; padding: 0 .3rem; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-size: .8rem; font-family: var(--mono); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .75rem; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .8rem 1rem; display: flex; flex-direction: column; gap: .2rem; }
.kpi-l { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.kpi-v { font-size: 1.35rem; font-weight: 500; }
.kpi-s { font-size: .82rem; color: var(--muted); }
.kpi.warn .kpi-v { color: var(--warn); }

/* tables */
.dt { display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
.dt-tools { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.dt-tools .search { max-width: 280px; }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel .tbl-wrap { border: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th { text-align: left; font-weight: 700; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: .55rem .7rem; border-bottom: 1px solid var(--line-2); background: var(--surface-2); white-space: nowrap; cursor: pointer; user-select: none; position: sticky; top: 0; }
.tbl td { padding: .5rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.num, .tbl th.num { text-align: right; } .tbl td.num { font-family: var(--mono); font-size: .86rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tbody tr.click { cursor: pointer; } .tbl tbody tr.click:hover { background: var(--surface-2); }
.tbl tfoot td { font-weight: 700; border-top: 2px solid var(--line-2); border-bottom: 0; background: var(--surface-2); }
.tbl .empty { text-align: center; color: var(--muted); padding: 2rem; }
.tbl tr.locked td:first-child::before { content: "🔒 "; font-size: .75rem; }
.tbl tr.neg-row td, .neg { color: var(--danger); } .pos { color: var(--ok); }
.tbl tr.muted-row td, .tbl tr.dim td { color: var(--muted); }
.tbl.compact td, .tbl.compact th { padding: .4rem .55rem; }
.tbl.report tr.sub td { font-weight: 700; background: var(--surface-2); }
.tbl.report tr.total td { font-weight: 700; border-top: 2px solid var(--fg); }
.more { align-self: center; }
.tbl.edit td { vertical-align: middle; padding: .35rem .4rem; }
.tbl.edit th { cursor: default; }
.tbl.edit td.prod { min-width: 230px; } .tbl.edit td.prod small { display: block; margin-top: 2px; }
.tbl.edit input.num { width: 104px; }
.tbl.report td:first-child { white-space: nowrap; } .tbl.edit select { min-width: 130px; }
.tbl.edit .n { width: 2rem; }
.alt-units { display: flex; flex-direction: column; gap: .4rem; align-items: flex-start; }
.alt-row { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; } .alt-row select { width: auto; min-width: 150px; } .alt-row input { width: 120px; }
.pw { position: relative; } .pw input { padding-right: 2.5rem; }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); cursor: pointer; padding: .35rem; display: grid; border-radius: 4px; }
.pw-eye:hover { color: var(--fg); background: var(--surface-2); }
.tbl.edit select.unit-sel { min-width: 0; width: 130px; }
.tag.opening { color: var(--muted); }
.acc { min-width: 130px; } .acc input { width: 130px; } .acc-n { display: block; font-size: .72rem; color: var(--muted); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acc input.badin, input.badin { border-color: var(--danger); }
.entries { display: flex; flex-direction: column; gap: .5rem; }
.entries .tbl.edit input.num { width: 140px; } .tbl.edit td.num > input.num:not([type]) { width: 140px; }
.tbl tr.grp-row td { font-weight: 700; background: var(--surface-2); } .tbl tr.sub-row td:first-child { padding-left: 1.4rem; color: var(--accent); }
.tbl.bal tr.head td { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: .78rem; background: var(--accent-soft); color: var(--accent); }
.tbl.bal td.indent { padding-left: 1.6rem; }
.note.warnp { color: var(--warn); background: var(--warn-soft); padding: .5rem .7rem; border-radius: var(--r); } .note.okp { color: var(--ok); }
.filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .6rem .9rem; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .9rem; }
.filter-grid .fld > span { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.filter-grid .row-gap input { min-width: 0; } .fl-actions { flex-direction: row; align-items: center; gap: .6rem; flex-wrap: wrap; }
.img-fld { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; } .img-fld img { max-height: 90px; border-radius: 4px; border: 1px solid var(--line); }
.multi { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .3rem .8rem; max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r); padding: .5rem; }
.tops { display: flex; flex-direction: column; gap: .6rem; max-width: 1400px; margin: 0 auto 1rem; } .tops:empty { display: none; }
.ad { display: flex; gap: .9rem; align-items: center; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: .6rem .8rem; }
.ad img { width: 96px; height: 64px; object-fit: cover; border-radius: 4px; flex: none; }
.ad-body { display: flex; flex-direction: column; gap: .1rem; flex: 1; min-width: 0; } .ad-tag { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.deadline { display: flex; flex-direction: column; gap: .35rem; }
.dl-row { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; background: var(--warn-soft); color: var(--fg); border-left: 3px solid var(--warn); padding: .45rem .8rem; border-radius: 4px; }
.dl-row.today, .dl-row.late { background: var(--danger-soft); border-left-color: var(--danger); } .dl-left { color: var(--warn); font-weight: 700; } .dl-row.late .dl-left, .dl-row.today .dl-left { color: var(--danger); }
.bell { position: relative; } .bell-n { position: absolute; top: -2px; right: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--danger); color: #fff; font-size: .7rem; display: grid; place-items: center; padding: 0 4px; }
.bell-menu { min-width: 300px; } .bell-item { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .45rem .6rem; border-bottom: 1px solid var(--line); } .bell-item.late b { color: var(--danger); } .pad { padding: .5rem .6rem; margin: 0; }
.news-list { list-style: none; margin: 0; padding: 0; } .news-list li { padding: .4rem 0; border-bottom: 1px solid var(--line); } .news-body { white-space: pre-wrap; margin: .4rem 0 .2rem; color: var(--fg); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-h { text-align: center; font-size: .75rem; text-transform: uppercase; color: var(--muted); padding: .3rem 0; }
.cal-c { min-height: 92px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: .3rem; display: flex; flex-direction: column; gap: 3px; cursor: default; min-width: 0; }
.cal-c.empty { background: transparent; border-color: transparent; } .cal-c.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-d { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
.cal-e { border: 0; text-align: left; font-size: .76rem; background: var(--warn-soft); color: var(--fg); border-left: 3px solid var(--warn); padding: .15rem .3rem; border-radius: 3px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-e.done { background: var(--surface-2); border-left-color: var(--ok); color: var(--muted); text-decoration: line-through; }
.cal-add { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: .8rem; text-align: left; padding: 0; }
.cal-add { opacity: 0; } .cal-c:hover .cal-add, .cal-add:focus-visible { opacity: 1; } @media (hover: none) { .cal-add { opacity: .7; } }
.act-sel.badin { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.cal-title { min-width: 9rem; text-align: center; } .cal-li { display: flex; align-items: center; gap: .7rem; padding: .45rem 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; } .cal-li.done b { text-decoration: line-through; color: var(--muted); }
@media (max-width: 700px) { .cal-c { min-height: 64px; } .cal-e { font-size: .66rem; } }
.tbl.edit input.lname { margin-top: 4px; font-size: .85rem; padding: .3rem .5rem; }
.act-sel { min-width: 150px; } .tbl.edit input.tag-in { width: 130px; }
.barcol { width: 28%; min-width: 140px; } .bar { position: relative; height: 14px; background: var(--surface-2); border-radius: 3px; }
.bar span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent-soft); border-radius: 3px; } .bar span.gp { background: var(--accent); top: 4px; bottom: 4px; }
.legend { display: flex; align-items: center; gap: .4rem; } .lg { display: inline-block; width: 14px; height: 10px; border-radius: 2px; } .lg.net { background: var(--accent-soft); } .lg.gp { background: var(--accent); margin-left: .6rem; }
.bad { color: var(--danger); font-weight: 700; font-size: .82rem; } .good { color: var(--ok); font-size: .82rem; } .block { display: block; }
.vat-cell { display: flex; gap: .3rem; align-items: center; } .pct { display: flex; align-items: center; gap: 2px; } .tbl.edit .pct input.num { width: 70px; }
.tbl.edit input.num.sm { width: 68px; }
.tbl tr.warn-row td:last-child { color: var(--danger); font-weight: 700; }
.warn-t { display: block; color: var(--warn); font-size: .75rem; white-space: nowrap; }

/* doc editor */
.doc-head { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 1rem; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .8rem 1rem; align-items: end; }

/* MXIK / product dropdown */
.mxik, .psel { position: relative; }

.empty-card { grid-column: 1 / -1; border: 1px dashed var(--line-2); border-radius: var(--r); padding: 1.5rem; color: var(--muted); }
.danger-zone { color: var(--muted); } .danger-zone summary { cursor: pointer; margin-bottom: .6rem; }

/* lists */
.warn-list, .doc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.warn-list li { padding: .4rem 0; border-bottom: 1px solid var(--line); } .warn-list .link { color: var(--warn); }
.doc-list li .link { display: flex; gap: .5rem; align-items: center; width: 100%; color: var(--fg); padding: .45rem 0; border-bottom: 1px solid var(--line); }
.props { display: grid; grid-template-columns: max-content 1fr; gap: .45rem 1.2rem; margin: 0; } .props dt { color: var(--muted); } .props dd { margin: 0; }

/* menus */
.menu-wrap { position: relative; }
.menu { position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: var(--shadow); padding: .3rem; display: flex; flex-direction: column; min-width: 240px; }

.menu button:hover { background: var(--surface-2); }
.menu-head { display: flex; flex-direction: column; padding: .5rem .6rem; border-bottom: 1px solid var(--line); margin-bottom: .2rem; }

/* modal */
.modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(10,20,18,.45); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.modal-back.top { z-index: 200; }
.modal { background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
.modal.wide { width: min(820px, 100%); } .modal.small { width: min(440px, 100%); }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: .9rem 1.1rem; border-bottom: 1px solid var(--line); }
.modal-b { padding: 1rem 1.1rem; overflow-y: auto; }
.modal-b > p { margin: 0; }
.modal-f { display: flex; gap: .5rem; padding: .8rem 1.1rem; border-top: 1px solid var(--line); align-items: center; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .85rem 1rem; }
.form-grid .full { grid-column: 1 / -1; }
.toast { position: fixed; z-index: 300; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: .65rem 1.1rem; border-radius: var(--r); box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

.busy { position: fixed; inset: 0; z-index: 250; background: rgba(10,20,18,.25); display: grid; place-items: center; }
.busy-box { background: var(--surface); padding: 1rem 1.4rem; border-radius: var(--r); box-shadow: var(--shadow); }

/* login */
.login-wrap { min-height: 100%; display: grid; place-items: center; padding: 24px 16px;
  background: repeating-linear-gradient(0deg, transparent 0 31px, var(--line) 31px 32px), var(--bg); }
.login-card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.8rem; display: flex; flex-direction: column; gap: .9rem; box-shadow: var(--shadow); }

.lang-row { display: flex; gap: .4rem; justify-content: center; }

@media (max-width: 900px) {
